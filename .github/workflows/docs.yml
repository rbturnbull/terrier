
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v7
    - name: Install Graphviz
      run: sudo apt-get update && sudo apt-get install -y graphviz
    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies for Python ${{ matrix.python-version }}
      run: uv sync --locked

    - name: Build Sphinx docs
      run: uv run --no-sync sphinx-build -b html docs gh-pages

    - name: Run tests and generate coverage report
      run: |
        uv run --no-sync coverage run -m pytest
        echo "COVERAGE=$(uv run --no-sync coverage report --precision 2 | grep TOTAL | tr -s ' ' | cut -f 4 -d " ")" >> $GITHUB_ENV
        uv run --no-sync coverage html --directory gh-pages/coverage

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: 'gh-pages'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

    - name: Create Coverage Badge
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 5e0c3115955fde132a8b7c131da68b86
        filename: coverage-badge.json
        label: coverage
        message: ${{ env.COVERAGE }}
        color: green
