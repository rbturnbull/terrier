name: publish
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # Ensure submodules are checked out
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - name: Build library
        run: uv build
      - name: Publish library
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
